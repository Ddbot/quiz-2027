name: Supabase keepalive

# Supabase Free pauses a project after ~7 days of inactivity. Ping the Auth
# health endpoint every 3 days so a scheduled test event never needs manual
# reactivation (platform-foundation: "Free-tier database stays reachable",
# NFR-003).
#
# Note: `/rest/v1/` (schema root) now requires a *secret* API key under
# Supabase's new key system ("Only secret API keys can be used for this
# endpoint"). `/auth/v1/health` accepts the publishable/anon key, needs no
# schema/tables to exist yet, and still exercises the stack.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health
        run: |
          curl -fsS "${SUPABASE_URL%/}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -o /dev/null -w "HTTP %{http_code}\n"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
