name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @quiz/shared's dist/ is gitignored and untracked (built output), so a
      # fresh checkout has none — typecheck of any consuming package (e.g.
      # apps/party, since MILESTONE-05) needs it to exist first. `pnpm build`
      # alone respects workspace topological order and would build it before
      # any dependent, but Typecheck runs before the full Build step below.
      - name: Build shared package
        run: pnpm --filter @quiz/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # tools/db's RLS suite is part of `pnpm test`'s workspace fan-out, so
      # the local Supabase stack (Docker, pre-installed on this runner) has
      # to be up before that step runs.
      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Configure tools/db and apps/party env
        run: |
          # `supabase status -o env` mixes diagnostic lines (e.g. "Stopped
          # services: [...]") in with the KEY="value" ones — filter to the
          # well-formed assignments only before eval'ing them.
          eval "$(pnpm exec supabase status -o env 2>&1 | grep -E '^[A-Za-z_][A-Za-z0-9_]*="')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"
          # apps/party's test suite (since MILESTONE-05) connects to the
          # EventRoom Durable Object with real signed-in Supabase users and
          # needs these as worker secrets, not shell env — `.dev.vars` is the
          # local/CI equivalent of `wrangler secret put` (gitignored, never
          # committed; see apps/party/.dev.vars.example).
          {
            echo "SENTRY_DSN="
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY"
            echo "SUPABASE_JWKS_URL=$API_URL/auth/v1/.well-known/jwks.json"
          } > apps/party/.dev.vars

      - name: Test
        run: pnpm test

      - name: Shared package isolation
        run: pnpm check:shared-isolation
